<html lang="es">
<head>
  <meta charset="UTF-8">

      height: 100%;

      padding: 0;

<body class="flex flex-col h-screen bg-slate-100 text-slate-800 overflow-hidden">

  <!-- Single Streamlined Top Bar (Oficial Violeta #581c87 y Verde Esmeralda #059669) -->
  <header class="bg-white border-b border-slate-200 px-3 sm:px-4 py-2 flex items-center justify-between gap-3 shrink-0 shadow-xs z-30">
    
    <!-- Institutional Brand & Public Services Emblem -->
    <div class="flex items-center gap-2.5 shrink-0">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-purple-900 via-purple-950 to-emerald-950 p-1 flex items-center justify-center shadow-xs border border-purple-800/40 relative">
        <svg viewBox="0 0 48 48" fill="none" class="w-full h-full">
          <path d="M24 6C14.0589 6 6 14.0589 6 24C6 33.9411 14.0589 42 24 42C27.5 42 30.7 41.0 33.4 39.3L38 43L41 39L36.8 35.3C39.4 32.2 41 28.3 41 24C41 14.0589 32.9411 6 24 6Z" fill="#581c87" stroke="#10b981" stroke-width="2.5" />
          <circle cx="24" cy="24" r="11" fill="#064e3b" />
          <path d="M20 32L22 16H26L28 32" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />
          <path d="M24 13V15M24 33V35M13 24H15M33 24H35M16 16L17.5 17.5M30.5 30.5L32 32M16 32L17.5 30.5M30.5 17.5L32 16" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="24" cy="24" r="3.5" fill="#10b981" />
        </svg>
        <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 bg-emerald-500 rounded-full border border-white"></span>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="font-black text-purple-950 text-base sm:text-lg tracking-tight">QUILMES <span class="text-emerald-600">360</span></span>
          <span class="text-[10px] font-bold px-1.5 py-0.2 bg-emerald-100 text-emerald-800 rounded font-mono border border-emerald-300 hidden sm:inline">SERVICIOS PÚBLICOS</span>
        </div>
        <div class="text-[10px] text-slate-500 font-medium hidden md:block">Secretaría de Servicios Públicos · Municipalidad de Quilmes</div>
      </div>
    </div>

    <!-- Search Input -->
    <div class="flex-1 max-w-sm sm:max-w-md mx-1 relative">
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Buscar barrio, calle o punto crítico (Bernal, 162, Conesa)..." 
        class="w-full text-xs pl-3 pr-7 py-1.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-purple-600 focus:bg-white transition-all shadow-inner"
      />
      <button id="clearSearch" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs font-bold">✕</button>
    </div>

    <!-- Compact Inline Filter Pills -->
    <div class="hidden xl:flex items-center gap-1 shrink-0 text-xs">
      <button onclick="filterCategory('todos')" class="filter-pill px-2.5 py-1 rounded-md text-xs font-bold border transition-all bg-purple-900 text-white border-purple-950 shadow-xs" data-cat="todos">
        🗺️ Todas (88)
      </button>
      <button onclick="filterCategory('ribera')" class="filter-pill px-2.5 py-1 rounded-md text-xs font-semibold border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-100" data-cat="ribera">
        🌊 Costa
      </button>
      <button onclick="filterCategory('microbasurales')" class="filter-pill px-2.5 py-1 rounded-md text-xs font-semibold border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-100" data-cat="microbasurales">
        ⚠️ Microbasurales
      </button>
      <button onclick="filterCategory('voluminosos')" class="filter-pill px-2.5 py-1 rounded-md text-xs font-semibold border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-100" data-cat="voluminosos">
        📦 Voluminosos
      </button>
      <button onclick="filterCategory('bacheo')" class="filter-pill px-2.5 py-1 rounded-md text-xs font-semibold border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-100" data-cat="bacheo">
        🚧 Bacheo
      </button>
      <button onclick="filterCategory('sumideros')" class="filter-pill px-2.5 py-1 rounded-md text-xs font-semibold border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-100" data-cat="sumideros">
        💧 Sumideros
      </button>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btnSoloQuilmes" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-purple-900 text-white border border-purple-950 flex items-center gap-1 shadow-xs hover:bg-purple-950 transition-colors">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span class="hidden sm:inline">Solo Quilmes</span>
      </button>
      <button id="btnResetView" title="Restablecer vista a todo el partido" class="px-2 py-1 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 border border-slate-300 hover:bg-slate-200 transition-colors">
        <span>🏠</span>
      </button>
      <button onclick="window.print()" title="Imprimir cartografía" class="px-2 py-1 text-xs font-semibold rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 shadow-xs transition-colors hidden sm:block">
        <span>🖨️</span>
      </button>
    </div>
  </header>

  <!-- Main Map Container -->
  <main class="relative flex-1 w-full h-full">
    <div id="map"></div>

    <!-- Floating Didactic Quick Atajos (Zero vertical height consumed) -->
    <div id="floatingAtajos" class="absolute top-3 left-1/2 -translate-x-1/2 z-20 bg-white/95 backdrop-blur-md border border-purple-200/90 rounded-full px-3 py-1 shadow-md flex items-center gap-2 max-w-[95vw] overflow-x-auto text-[11px]">
      <span class="font-extrabold text-purple-950 flex items-center gap-1 shrink-0">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Atajos:
      </span>
      <div class="flex items-center gap-1 overflow-x-auto">
        <button onclick="jumpToZone('z_ribera_bernal')" class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-emerald-100 hover:text-emerald-950 text-slate-700 font-semibold border border-slate-200 whitespace-nowrap transition-colors">
          🌊 Bernal Ribera
        </button>
        <button onclick="jumpToZone('z_ribera_uno')" class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-emerald-100 hover:text-emerald-950 text-slate-700 font-semibold border border-slate-200 whitespace-nowrap transition-colors">

        <button onclick="jumpToPoint('MIC-001')" class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-emerald-100 hover:text-emerald-950 text-slate-700 font-semibold border border-slate-200 whitespace-nowrap transition-colors">
          ⚠️ Microbasural 162
        </button>
        <button onclick="jumpToPoint('MIC-002')" class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-emerald-100 hover:text-emerald-950 text-slate-700 font-semibold border border-slate-200 whitespace-nowrap transition-colors">
          ⚠️ Pedemonte
        </button>
        <button onclick="jumpToPoint('VOL-001')" class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-emerald-100 hover:text-emerald-950 text-slate-700 font-semibold border border-slate-200 whitespace-nowrap transition-colors">
          📦 Voluminosos Don Bosco
        </button>
        <button onclick="jumpToPoint('PLZ-002')" class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-emerald-100 hover:text-emerald-950 text-slate-700 font-semibold border border-slate-200 whitespace-nowrap transition-colors">
          📍 Plaza Conesa
        </button>
        <button onclick="jumpToPoint('PLZ-001')" class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-emerald-100 hover:text-emerald-950 text-slate-700 font-semibold border border-slate-200 whitespace-nowrap transition-colors">
          🏛️ Quilmes Centro
        </button>
      </div>
      <button onclick="document.getElementById('floatingAtajos').remove()" title="Ocultar atajos" class="text-slate-400 hover:text-slate-700 pl-1 font-bold text-xs shrink-0">✕</button>
    </div>
    <div id="map"></div>

    <!-- Floating Info Drawer / Card (Didactic) -->
    <div id="infoCard" class="hidden absolute top-4 right-4 w-84 bg-white/95 backdrop-blur-md border border-purple-300 rounded-2xl p-4 shadow-2xl z-30 animate-in fade-in max-w-[calc(100vw-2rem)]">
      <div class="flex items-center justify-between">
        <span id="infoBadge" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border uppercase">
          DETALLE
        </span>
        <button onclick="closeInfoCard()" class="text-slate-400 hover:text-slate-600 p-1 font-bold">✕</button>
      </div>
      <h4 id="infoTitle" class="mt-2 text-sm font-bold text-slate-900"></h4>
      <p id="infoSubtitle" class="text-xs text-slate-600 mt-0.5"></p>
      <div id="infoBody" class="mt-2 text-xs bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-1"></div>
      <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center gap-2">
        <button id="infoBtnCenter" class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg text-xs font-semibold flex items-center justify-center gap-1 transition-colors">
          🎯 Centrar
        </button>
        <button onclick="alert('Piloto Quilmes 360: Función para registrar nueva intervención operativa en esta ubicación.')" class="flex-1 py-1.5 bg-purple-900 hover:bg-purple-950 text-white rounded-lg text-xs font-semibold flex items-center justify-center gap-1 transition-colors">
          ➕ Nueva tarea
        </button>
      </div>
    </div>

    <!-- Floating Legend (Bottom Left) -->
    <div class="absolute bottom-6 left-4 bg-white/95 backdrop-blur-xs border border-slate-200 rounded-xl p-3 shadow-lg z-20 text-xs hidden sm:block">
      <div class="font-bold text-purple-950 text-[11px] mb-1.5 flex items-center justify-between gap-2">
        <span>REFERENCIAS OPERATIVAS</span>
      </div>
      <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-[10px] text-slate-600">
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> Turno Mañana</div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Turno Tarde</div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Turno Noche</div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span> Diferenciada</div>
        <div class="flex items-center gap-1.5"><span>⚠️</span> Microbasurales</div>
        <div class="flex items-center gap-1.5"><span>📦</span> Voluminosos</div>
        <div class="flex items-center gap-1.5"><span>💧</span> Sumideros</div>
        <div class="flex items-center gap-1.5"><span>🚧</span> Bacheo</div>
      </div>
    </div>
  </main>

:-58.259,"address":"Conesa y Moreno, Quilmes Centro","zonaId":"ZONA-03","status":"operativo","details":"Poda correctiva y puesta en valor de juegos infantiles."},{"id":"PLZ-003","name":"Plaza del Maestro","type":"plaza","lat":-34.711,"lng":-58.281,"address":"Independencia y Carabelas, Bernal","zonaId":"ZONA-01","status":"operativo","details":"Corte de césped semanal por Cuadrilla 05."},{"id":"PLZ-004","name":"Parque de la Ciudad","type":"plaza","lat":-34.743,"lng":-58.268,"address":"Vicente López y Smith, Quilmes Oeste","zonaId":"ZONA-06","status":"operativo","details":"Pista de atletismo y circuito aeróbico municipal."},{"id":"PLZ-005","name":"Plaza Yapeyú","type":"plaza","lat":-34.776,"lng":-58.322,"address":"Av. 844 y Calle 895, Solano","zonaId":"ZONA-10","status":"operativo","details":"Recambio de bancos y cestos antivandálicos."},{"id":"BMB-001","name":"Estación de Bombeo Ribera Norte","type":"bomba","lat":-34.714,"lng":-58.238,"address":"Av. Otamendi y Costanera, Quilmes Este","zonaId":"ZONA-04","status":"operativo","details":"4 electrobombas sumergibles operando al 100% de caudal."},{"id":"BMB-002","name":"Aliviador Bajo Vías San Martín","type":"bomba","lat":-34.707,"lng":-58.284,"address":"Paso Bajo Nivel San Martín, Bernal","zonaId":"ZONA-01","status":"operativo","details":"Sensores de nivel pluvial activos con alerta automática."},{"id":"BMB-003","name":"Bomba Cuenca Arroyo Las Piedras","type":"bomba","lat":-34.786,"lng":-58.332,"address":"Arroyo Las Piedras y Calle 850, Solano","zonaId":"ZONA-11","status":"operativo","details":"Generador diésel de respaldo probado el 24/10/2026."},{"id":"OBR-001","name":"Obrador Central Servicios Públicos","type":"obrador","lat":-34.7335,"lng":-58.2675,"address":"Av. 12 de Octubre y Mosconi, Quilmes Oeste","zonaId":"ZONA-05","status":"operativo","details":"Base central de camiones desobstructores, hidrogrúas y motoniveladoras."},{"id":"OBR-002","name":"Base Operativa Solano / La Florida","type":"obrador","lat":-34.77,"lng":-58.315,"address":"Camino Gral. Belgrano y 844","zonaId":"ZONA-09","status":"operativo","details":"Despacho de Cuadrilla 02 (Pluviales Sur) y Cuadrilla 04."}];

    const bounds = L.latLngBounds([-34.812, -58.355], [-34.670, -58.190]);
    const center = [-34.730, -58.270];

    const map = L.map('map', {
      center: center,
      zoom: 13,
      minZoom: 11,
      maxZoom: 18,
      maxBounds: bounds,
      maxBoundsViscosity: 0.7,
      zoomControl: false
    });

    L.control.zoom({ position: 'topright' }).addTo(map);

    // OpenStreetMap Base Tiles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap · Municipalidad de Quilmes (Plan 2027)',
      maxZoom: 19
    }).addTo(map);

    // Dedicated Pane for Isolation Mask
    const maskPane = map.createPane('maskPane');
    maskPane.style.zIndex = 420;
    maskPane.style.pointerEvents = 'none';

    // Layer Groups
    const maskGroup = L.layerGroup().addTo(map);
    const zonesGroup = L.layerGroup().addTo(map);
    const pointsGroup = L.layerGroup().addTo(map);

    let isolateActive = true;

    // 1. Draw Clean Isolation Mask
    function drawMask() {
      maskGroup.clearLayers();
      if (!isolateActive) return;

      const outerBox = [
        [-34.20, -59.30],
        [-34.20, -57.20],
        [-35.30, -57.20],
        [-35.30, -59.30],
        [-34.20, -59.30]
      ];

      const hole = QUILMES_PERIMETER.map(c => [c[1], c[0]]);
      const maskPolygon = L.polygon([outerBox, hole], {
        pane: 'maskPane',
        fillColor: '#ffffff',
        fillOpacity: 1.0,
        stroke: true,
        color: '#6b21a8',
        weight: 3.5,
        opacity: 1.0,
        interactive: false
      });
      maskGroup.addLayer(maskPolygon);
    }
    drawMask();

    // 2. Draw 88 Territorial Zones
    let activeCategory = 'todos';

    function renderZones() {
      zonesGroup.clearLayers();
      QUILMES_ZONES.forEach(zone => {
        // filter check
        if (activeCategory === 'ribera' && !zone.id.includes('ribera')) return;

        const latLngs = zone.coordinates.map(c => [c[1], c[0]]);
        const polygon = L.polygon(latLngs, {
          color: zone.color,
          weight: 1.2,
          fillColor: zone.fillColor,
          fillOpacity: 0.32,
          opacity: 0.85
        });

        polygon.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          showZoneDetails(zone);
        });

        polygon.bindTooltip(`
          <div style="font-family: system-ui; font-size: 11px; padding: 2px;">
            <strong style="color: #1e1b4b; font-size: 12px;">${zone.name}</strong><br/>
            <span style="color: ${zone.color}; font-weight: 700;">Turno: ${zone.turno}</span><br/>
            <span style="color: #64748b; font-size: 10px;">Recorrido #${zone.recorrido}</span>
          </div>
        `, { sticky: true });

        zonesGroup.addLayer(polygon);
      });
    }
    renderZones();

    // 3. Draw GIS Points
    function renderPoints() {
      pointsGroup.clearLayers();
      QUILMES_POINTS.forEach(point => {
        let isVisible = false;
        let badge = 'S';
        let color = '#0284c7';
        let bg = '#e0f2fe';

        if (activeCategory === 'todos') {
          isVisible = true;
        } else if (activeCategory === 'microbasurales' && point.type === 'microbasural') {
          isVisible = true;
        } else if (activeCategory === 'voluminosos' && point.type === 'voluminoso') {
          isVisible = true;
        } else if (activeCategory === 'bacheo' && point.type === 'bache') {
          isVisible = true;
        } else if (activeCategory === 'sumideros' && point.type === 'sumidero') {
          isVisible = true;
        } else if (activeCategory === 'plazas' && (point.type === 'plaza' || point.type === 'ecopunto')) {
          isVisible = true;
        } else if (activeCategory === 'ribera' && (point.address.toLowerCase().includes('ribera') || point.name.toLowerCase().includes('ribera'))) {
          isVisible = true;
        }

        if (point.type === 'microbasural') { badge = '⚠️'; color = '#dc2626'; bg = '#fee2e2'; }
        else if (point.type === 'voluminoso') { badge = '📦'; color = '#d97706'; bg = '#fef3c7'; }
        else if (point.type === 'ecopunto') { badge = '♻️'; color = '#15803d'; bg = '#dcfce7'; }
        else if (point.type === 'sumidero') { badge = 'S'; color = '#0284c7'; bg = '#e0f2fe'; }
        else if (point.type === 'bache') { badge = 'B'; color = '#ea580c'; bg = '#ffedd5'; }
        else if (point.type === 'plaza') { badge = 'P'; color = '#16a34a'; bg = '#dcfce7'; }
        else if (point.type === 'bomba') { badge = '⚡'; color = '#4f46e5'; bg = '#e0e7ff'; }
        else if (point.type === 'obrador') { badge = '🏢'; color = '#7c3aed'; bg = '#ede9fe'; }

        if (!isVisible) return;

        const icon = L.divIcon({
          className: 'custom-gis-point-marker',
          html: `
            <div style="width: 24px; height: 24px; background: ${bg}; border: 2px solid ${color}; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: ${color}; box-shadow: 0 2px 5px rgba(0,0,0,0.3); cursor: pointer;">
              ${badge}
            </div>
          `,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        const marker = L.marker([point.lat, point.lng], { icon });
        marker.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          showPointDetails(point);
        });
        marker.bindTooltip(`
          <div style="font-family: system-ui; font-size: 11px;">
            <strong style="color: #0f172a;">${point.name}</strong><br/>
            <span style="color: #64748b;">${point.address}</span>
          </div>
        `, { direction: 'top', offset: [0, -12] });

        pointsGroup.addLayer(marker);
      });
    }
    renderPoints();

    // Detail Drawer Handlers
    function showZoneDetails(zone) {
      const card = document.getElementById('infoCard');
      document.getElementById('infoBadge').className = "text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border uppercase bg-purple-100 text-purple-900 border-purple-200";
      document.getElementById('infoBadge').innerText = zone.name + " · " + zone.turno;
      document.getElementById('infoTitle').innerText = zone.name + " · Ciudad de Quilmes";
      document.getElementById('infoSubtitle').innerText = "Turno de Operaciones: " + zone.turno;
      document.getElementById('infoBody').innerHTML = `
        <div><strong class="text-slate-700">Recorrido asignado:</strong> #${zone.recorrido}</div>
        <div><strong class="text-slate-700">Vértices georreferenciados:</strong> ${zone.coordinates.length} puntos</div>
        <div><strong class="text-slate-700">Jurisdicción:</strong> Municipalidad de Quilmes</div>
      `;
      document.getElementById('infoBtnCenter').onclick = () => {
        const c = zone.coordinates[0];
        map.flyTo([c[1], c[0]], 15, { duration: 0.8 });
      };
      card.classList.remove('hidden');
    }

    function showPointDetails(point) {
      const card = document.getElementById('infoCard');
      let badgeStyle = "bg-purple-100 text-purple-900 border-purple-200";
      if (point.type === 'microbasural') badgeStyle = "bg-rose-100 text-rose-900 border-rose-300";
      else if (point.type === 'voluminoso') badgeStyle = "bg-amber-100 text-amber-900 border-amber-300";
      else if (point.type === 'ecopunto') badgeStyle = "bg-emerald-100 text-emerald-900 border-emerald-300";
      else if (point.type === 'sumidero') badgeStyle = "bg-cyan-100 text-cyan-900 border-cyan-300";

      document.getElementById('infoBadge').className = "text-[10px] font-mono font-bold px-2 py-0.5 rounded-full border uppercase " + badgeStyle;
      document.getElementById('infoBadge').innerText = point.type + " · " + point.id;
      document.getElementById('infoTitle').innerText = point.name;
      document.getElementById('infoSubtitle').innerText = point.address;
      document.getElementById('infoBody').innerHTML = `
        <div class="text-slate-700 font-medium">${point.details}</div>
        <div class="mt-1 flex items-center gap-2 text-[10px] text-slate-500 font-mono">
          <span>Estado: <strong class="text-purple-900 uppercase">${point.status.replace('_', ' ')}</strong></span>
          <span>•</span>
          <span>Zona: ${point.zonaId}</span>
        </div>
      `;
      document.getElementById('infoBtnCenter').onclick = () => {
        map.flyTo([point.lat, point.lng], 17, { duration: 0.8 });
      };
      card.classList.remove('hidden');
    }

    function closeInfoCard() {
      document.getElementById('infoCard').classList.add('hidden');
    }

    // Filter Category Action
    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.filter-pill').forEach(p => {
        if (p.getAttribute('data-cat') === cat) {
          p.className = "filter-pill px-3 py-1 rounded-full text-xs font-semibold border transition-all shrink-0 bg-purple-950 text-white border-purple-950";
        } else {
          p.className = "filter-pill px-3 py-1 rounded-full text-xs font-semibold border transition-all shrink-0 bg-white text-slate-600 border-slate-200 hover:bg-slate-100";
        }
      });
      renderZones();
      renderPoints();
      if (cat === 'ribera') {
        map.flyTo([-34.715, -58.245], 13.5, { duration: 1 });
      }
    }

    // Quick Jumps
    function jumpToZone(zoneId) {
      const z = QUILMES_ZONES.find(item => item.id === zoneId);
      if (z) {
        const c = z.coordinates[0];
        map.flyTo([c[1], c[0]], 14.5, { duration: 0.8 });
        showZoneDetails(z);
      }
    }

    function jumpToPoint(pointId) {
      const p = QUILMES_POINTS.find(item => item.id === pointId);
      if (p) {
        map.flyTo([p.lat, p.lng], 16.5, { duration: 0.8 });
        showPointDetails(p);
      }
    }

    // Search Input Logic
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim().toLowerCase();
      clearSearch.style.display = val ? 'block' : 'none';
      if (!val) return;

      const z = QUILMES_ZONES.find(item => item.name.toLowerCase().includes(val) || item.turno.toLowerCase().includes(val));
      if (z) {
        const c = z.coordinates[0];
        map.flyTo([c[1], c[0]], 15, { duration: 0.8 });
        showZoneDetails(z);
        return;
      }

      const p = QUILMES_POINTS.find(item => item.name.toLowerCase().includes(val) || item.address.toLowerCase().includes(val));
      if (p) {
        map.flyTo([p.lat, p.lng], 16.5, { duration: 0.8 });
        showPointDetails(p);
      }
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.style.display = 'none';
    });

    // Reset View Button
    document.getElementById('btnResetView').addEventListener('click', () => {
      map.flyTo(center, 13, { duration: 0.9 });
    });

    // Toggle Solo Quilmes
    document.getElementById('btnSoloQuilmes').addEventListener('click', () => {
      isolateActive = !isolateActive;
      drawMask();
      const btn = document.getElementById('btnSoloQuilmes');
      if (isolateActive) {
        btn.className = "px-2.5 py-1 text-xs font-semibold rounded-lg bg-purple-900 text-white border border-purple-900 flex items-center gap-1 shadow-xs hover:bg-purple-950 transition-colors";
        btn.innerHTML = "<span>✨ Solo Quilmes</span>";
      } else {
        btn.className = "px-2.5 py-1 text-xs font-semibold rounded-lg bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 transition-colors";
        btn.innerHTML = "<span>Mostrar Vecinos</span>";
      }
    });

    // Initial fit
    setTimeout(() => {
      map.invalidateSize();
      map.fitBounds(bounds, { padding: [20, 20] });
    }, 200);
  </script>
</body>
